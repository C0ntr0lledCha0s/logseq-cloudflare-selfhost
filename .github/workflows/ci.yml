name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
    inputs:
      upstream_ref:
        description: Upstream ref to build; defaults to UPSTREAM_REF
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.upstream_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.local/share/pnpm/store
            .cache/shadow-cljs
          key: upstream-build-${{ inputs.upstream_ref || hashFiles('UPSTREAM_REF') }}
          restore-keys: |
            upstream-build-

      - name: Install and unit test
        run: |
          npm ci
          npm test

      - name: Fetch patched upstream
        run: |
          scripts/fetch-upstream.sh .upstream "$UPSTREAM_REF_INPUT"
          if [ -d .cache/shadow-cljs ]; then
            cp -a .cache/shadow-cljs .upstream/deps/db-sync/.shadow-cljs
          fi

      - name: Check upstream bindings
        run: node scripts/check-upstream-bindings.mjs .upstream/deps/db-sync/worker/wrangler.toml

      - name: Build
        run: |
          scripts/build.sh .upstream
          rm -rf .cache/shadow-cljs
          if [ -d .upstream/deps/db-sync/.shadow-cljs ]; then
            mkdir -p .cache
            cp -a .upstream/deps/db-sync/.shadow-cljs .cache/shadow-cljs
          fi

      - name: Render and dry-run deploy for both plans
        run: |
          placeholder="$RUNNER_TEMP/tofu-output.json"
          echo '{"d1_database_id":{"value":"00000000-0000-0000-0000-000000000000"}}' > "$placeholder"
          worker_dir="$PWD/.upstream/deps/db-sync/worker"
          wrangler="$PWD/.upstream/deps/db-sync/node_modules/.bin/wrangler"
          pristine="$RUNNER_TEMP/upstream-wrangler.toml"
          cp "$worker_dir/wrangler.toml" "$pristine"
          for plan in free paid; do
            node scripts/render-wrangler.mjs \
              --upstream "$pristine" \
              --settings config/settings.json \
              --tofu-outputs "$placeholder" \
              --out "$RUNNER_TEMP/wrangler.$plan.toml" \
              --hostname sync.example.com \
              --plan "$plan"
            cp "$RUNNER_TEMP/wrangler.$plan.toml" "$worker_dir/wrangler.toml"
            (cd "$worker_dir" && "$wrangler" deploy --dry-run --outdir "$RUNNER_TEMP/dry-run-$plan")
          done

      - name: Build, test and dry-run deploy the connector
        run: |
          scripts/vendor-upstream-api.sh .upstream
          npm --prefix connector ci
          npm --prefix connector test
          npm --prefix connector run typecheck
          node connector/scripts/check-tools-manifest.mjs
          placeholder="$RUNNER_TEMP/connector-tofu-output.json"
          echo '{"connector_oauth_kv_id":{"value":"00000000000000000000000000000000"},"connector_d1_id":{"value":"00000000-0000-0000-0000-000000000000"}}' > "$placeholder"
          settings="$RUNNER_TEMP/connector-settings.json"
          node -e '
            const fs = require("fs");
            const settings = JSON.parse(fs.readFileSync("config/settings.json", "utf8"));
            settings.connector.enabled = true;
            fs.writeFileSync(process.argv[1], JSON.stringify(settings));
          ' "$settings"
          node scripts/render-connector-wrangler.mjs \
            --template connector/wrangler.template.jsonc \
            --settings "$settings" \
            --tofu-outputs "$placeholder" \
            --out connector/wrangler.json \
            --hostname mcp.example.com
          (cd connector && node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run-connector")

      - name: OpenTofu format and validate
        env:
          TF_VAR_tofu_encryption_passphrase: ci-dummy-passphrase-not-a-secret
          TF_VAR_cloudflare_account_id: "00000000000000000000000000000000"
        run: |
          tofu -chdir=infra fmt -check -recursive
          tofu -chdir=infra init -backend=false -input=false
          tofu -chdir=infra validate
