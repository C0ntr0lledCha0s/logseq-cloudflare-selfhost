name: bump-upstream

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-upstream
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      old: ${{ steps.resolve.outputs.old }}
      new: ${{ steps.resolve.outputs.new }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Compare upstream master with UPSTREAM_REF
        id: resolve
        run: |
          old="$(tr -d '[:space:]' < UPSTREAM_REF)"
          new="$(git ls-remote https://github.com/logseq/logseq.git refs/heads/master | cut -f1)"
          if ! printf '%s' "$new" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve upstream master" >&2
            exit 1
          fi
          {
            echo "old=$old"
            echo "new=$new"
            if [ "$old" = "$new" ]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
          } >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.new }}

  pr:
    needs: [resolve, check]
    if: always() && needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      OLD_SHA: ${{ needs.resolve.outputs.old }}
      NEW_SHA: ${{ needs.resolve.outputs.new }}
      CI_RESULT: ${{ needs.check.result }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch upstream history between the two SHAs
        run: |
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/logseq/logseq.git
          git -C "$RUNNER_TEMP/upstream" fetch -q --filter=blob:none origin "$OLD_SHA" "$NEW_SHA"

      - name: Write PR body
        run: scripts/bump-pr-body.sh "$OLD_SHA" "$NEW_SHA" "$CI_RESULT" "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/pr-body.md"

      - name: Create or update the bump PR
        run: |
          short="${NEW_SHA:0:10}"
          existing="$(gh pr list --state open --base "$BASE_BRANCH" --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("bump/upstream-"))][0] // empty')"
          if [ -n "$existing" ]; then
            number="$(jq -r '.number' <<< "$existing")"
            branch="$(jq -r '.headRefName' <<< "$existing")"
          else
            number=""
            branch="bump/upstream-$short"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          printf '%s\n' "$NEW_SHA" > UPSTREAM_REF
          git add UPSTREAM_REF
          git commit -q -m "chore: bump upstream to $short"
          git push --force origin "$branch"

          title="chore: bump upstream to $short"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
