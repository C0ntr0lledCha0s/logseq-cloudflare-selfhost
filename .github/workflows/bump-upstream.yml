name: bump-upstream

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-upstream
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      old: ${{ steps.resolve.outputs.old }}
      new: ${{ steps.resolve.outputs.new }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Compare upstream master with UPSTREAM_REF
        id: resolve
        run: |
          old="$(tr -d '[:space:]' < UPSTREAM_REF)"
          new="$(git ls-remote https://github.com/logseq/logseq.git refs/heads/master | cut -f1)"
          if ! printf '%s' "$new" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve upstream master" >&2
            exit 1
          fi
          {
            echo "old=$old"
            echo "new=$new"
            if [ "$old" = "$new" ]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
          } >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upstream_ref: ${{ needs.resolve.outputs.new }}

  pr:
    needs: [resolve, check]
    if: always() && needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      OLD_SHA: ${{ needs.resolve.outputs.old }}
      NEW_SHA: ${{ needs.resolve.outputs.new }}
      CI_RESULT: ${{ needs.check.result }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          # bump-branch.sh compares the bump branch with main and may merge main into it.
          fetch-depth: 0

      - name: Fetch upstream history between the two SHAs
        run: |
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/logseq/logseq.git
          git -C "$RUNNER_TEMP/upstream" fetch -q --filter=blob:none origin "$OLD_SHA" "$NEW_SHA"

      - name: Write PR body
        run: scripts/bump-pr-body.sh "$OLD_SHA" "$NEW_SHA" "$CI_RESULT" "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/pr-body.md"

      - name: Update the bump branch
        id: bump
        run: |
          existing="$(gh pr list --state open --base "$BASE_BRANCH" --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("bump/upstream-"))][0] // empty')"
          if [ -n "$existing" ]; then
            number="$(jq -r '.number' <<< "$existing")"
            branch="$(jq -r '.headRefName' <<< "$existing")"
          else
            number=""
            branch="bump/upstream-${NEW_SHA:0:10}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # Rebuilds and force-pushes the branch only when every commit on it is the bot's own;
          # commits anyone else pushed (a patch refresh) are kept (scripts/bump-branch.sh).
          scripts/bump-branch.sh "$branch" "$NEW_SHA" "$BASE_BRANCH" "$RUNNER_TEMP/bump-note.md"

      - name: Create or update the bump PR
        env:
          NUMBER: ${{ steps.bump.outputs.number }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          MODE: ${{ steps.bump.outputs.mode }}
        run: |
          title="chore: bump upstream to ${NEW_SHA:0:10}"
          note="$RUNNER_TEMP/bump-note.md"
          if [ -n "$NUMBER" ]; then
            # A skipped branch still pins its earlier upstream commit, so its title and body stay.
            if [ "$MODE" != "skip" ]; then
              gh pr edit "$NUMBER" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            fi
            pr="$NUMBER"
          else
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            pr="$BRANCH"
          fi
          if [ -s "$note" ]; then
            gh pr comment "$pr" --body-file "$note"
            cat "$note" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs started by the default token don't trigger pull_request CI
      # (it waits for approval), but workflow_dispatch is allowed. This puts
      # the required `check` status on the PR's head commit.
      - name: Run CI on the bump branch
        if: steps.bump.outputs.mode != 'skip'
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
